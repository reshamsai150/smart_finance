function renderBills(){let tracked=t=>db.bills.some(b=>t.match.some(q=>(b.name||'').toLowerCase().includes(q))),missing=billTemplates.map((t,i)=>({...t,index:i})).filter(t=>!tracked(t));return header('Payments to remember','Bills & autopay','Track household, loan, card and subscription due dates. Add only the bills that apply to you.','<button class="btn primary" data-action="new-bill">＋ Add bill</button>')+'<div class="insight"><b>Checklist: bills people often miss</b>These are prompts, not bills the app knows you owe. Add your due date and amount to activate tracking. Autopay still needs your payment confirmation.</div><div class="panel feature-card" style="margin-top:14px"><div class="panel-title">Add common bills</div><div class="panel-sub">'+missing.length+' suggestions not matched to your tracked bill names</div><div class="bill-checklist">'+(missing.length?missing.map(t=>'<div class="bill-suggestion"><span class="entity-icon">'+icon(t.category)+'</span><span><b>'+esc(t.name)+'</b><small>'+esc(t.category)+' · '+esc(t.priority)+' priority</small></span><button class="btn small green" data-action="add-bill-template" data-id="'+t.index+'">Add</button></div>').join(''):'<div class="empty">All common bill types are represented in your list.</div>')+'</div><p class="detail-note">Shopping, groceries and other flexible purchases are expenses to track in Transactions and Budgets, rather than fixed bills. Add a category budget to set a spending cap.</p><button class="btn small" data-goto="budgets">Review budgets →</button></div><div class="panel" style="margin-top:14px"><div class="panel-head"><div><div class="panel-title">Your bills and recurring payments</div><div class="panel-sub">'+db.bills.length+' tracked · sorted by upcoming due date and payment urgency</div></div></div><div class="list">'+(db.bills.length?[...db.bills].sort((a,b)=>a.due.localeCompare(b.due)).map(b=>billRow(b)).join(''):'<div class="empty">Add a bill above to start your payment calendar.</div>')+'</div></div><div class="insight" style="margin-top:14px"><b>Payment status rule</b>A due date or autopay setting never marks a bill as paid. Confirm the debit after checking your bank or card statement.</div>'}

function reportBounds(period,date){let selected=new Date((date||iso(today))+'T00:00:00');if(Number.isNaN(selected.getTime()))selected=new Date(today);if(period==='month'){let start=new Date(selected.getFullYear(),selected.getMonth(),1),end=new Date(selected.getFullYear(),selected.getMonth()+1,1);return {start:iso(start),end:iso(end)}}if(period==='week'){let end=new Date(selected);end.setDate(end.getDate()+1);let start=new Date(end);start.setDate(start.getDate()-7);return {start:iso(start),end:iso(end)}}let end=new Date(selected);end.setDate(end.getDate()+1);return {start:iso(selected),end:iso(end)}}
function renderAnalytics(){let range=reportBounds(reportPeriod,reportDate),prevStart=new Date(range.start+'T00:00:00'),prevEnd=new Date(range.start+'T00:00:00'),days=Math.round((new Date(range.end+'T00:00:00')-new Date(range.start+'T00:00:00'))/86400000);prevStart.setDate(prevStart.getDate()-days);prevEnd=new Date(range.start+'T00:00:00');let list=db.transactions.filter(t=>t.date>=range.start&&t.date<range.end),prev=db.transactions.filter(t=>t.date>=iso(prevStart)&&t.date<iso(prevEnd)),income=sum(list.filter(t=>t.type==='income'),'amount'),expense=sum(list.filter(t=>t.type==='expense'),'amount'),priorExpense=sum(prev.filter(t=>t.type==='expense'),'amount'),cats={};list.filter(t=>t.type==='expense').forEach(t=>cats[t.category]=(cats[t.category]||0)+Number(t.amount));let top=Object.entries(cats).sort((a,b)=>b[1]-a[1]),budgets=db.budgets.map(b=>({b,spent:sum(list.filter(t=>t.type==='expense'&&t.category===b.category),'amount')})).sort((a,b)=>b.spent/Math.max(1,b.b.limit)-a.spent/Math.max(1,a.b.limit));let focus=top.find(([c])=>/food|dining|shopping|entertainment|subscription|software|travel/i.test(c))||top[0];let periodLabel=reportPeriod==='month'?new Date(range.start+'T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'}):reportPeriod==='week'?dateFmt(range.start,{day:'numeric',month:'short'})+' – '+dateFmt(iso(new Date(new Date(range.end+'T00:00:00').getTime()-86400000)),{day:'numeric',month:'short'}):dateFmt(range.start,{day:'numeric',month:'long',year:'numeric'});let compare=priorExpense?((expense-priorExpense)/priorExpense*100):null;return header('Understand your patterns','Spending reports','See where recorded money went, what is close to its limit, and what to review.','')+'<div class="toolbar"><select id="report-period" class="select"><option value="day" '+(reportPeriod==='day'?'selected':'')+'>Daily</option><option value="week" '+(reportPeriod==='week'?'selected':'')+'>Weekly · last 7 days</option><option value="month" '+(reportPeriod==='month'?'selected':'')+'>Monthly</option></select><input id="report-date" class="input" type="'+(reportPeriod==='month'?'month':'date')+'" value="'+(reportPeriod==='month'?range.start.slice(0,7):reportDate)+'" aria-label="Choose report date"></div><div class="stats grid"><div class="card stat"><div class="stat-top">Income · '+esc(periodLabel)+'</div><div class="stat-val positive">'+money(income)+'</div></div><div class="card stat"><div class="stat-top">Expenses · '+esc(periodLabel)+'</div><div class="stat-val">'+money(expense)+'</div></div><div class="card stat"><div class="stat-top">Net</div><div class="stat-val '+(income-expense>=0?'positive':'negative')+'">'+money(income-expense)+'</div></div><div class="card stat"><div class="stat-top">vs previous period</div><div class="stat-val '+(compare!==null&&compare>0?'negative':'positive')+'">'+(compare===null?'—':(compare>0?'+':'')+Math.round(compare)+'%')+'</div><div class="stat-foot">Recorded expense comparison</div></div></div><section class="panel feature-card"><div class="panel-head"><div><div class="panel-title">Where the money went</div><div class="panel-sub">'+(list.filter(t=>t.type==='expense').length)+' recorded expenses · transfers excluded</div></div></div>'+(top.length?'<div class="spending-table">'+top.map(([c,v])=>{let b=db.budgets.find(x=>x.category===c),p=b?Math.round(v/Math.max(1,b.limit)*100):null;return '<div class="spending-row"><div><b>'+icon(c)+' '+esc(c)+'</b><small>'+Math.round(v/Math.max(1,expense)*100)+'% of this period'+(b?' · '+money(Math.max(0,b.limit-v))+' budget left':' · no budget set')+'</small></div><div class="spending-amount">'+money(v)+'</div><span class="badge '+(p>=100?'red':p>=75?'amber':'green')+'">'+(p===null?'Set a cap':p+'% used')+'</span></div>'}).join('')+'</div>':'<div class="empty">No recorded expenses in this period. Add transactions to build an accurate report.</div>')+'</section><div class="grid dash-lower" style="margin-top:14px"><section class="panel feature-card"><div class="eyebrow">What to review</div><h3>'+(focus?esc(focus[0]):'Add your first expense')+'</h3><p>'+(focus?'This is your largest recorded category at '+money(focus[1])+' ('+Math.round(focus[1]/Math.max(1,expense)*100)+'% of spending) for '+esc(periodLabel)+'. Check whether the amount is expected and set or adjust its budget if needed.':'Record a few expenses to see category patterns.')+'</p><p class="detail-note">The app identifies high recorded spending; you decide what is necessary for your household.</p></section><section class="panel feature-card"><div class="eyebrow">Budget pressure</div>'+(budgets.length?budgets.slice(0,4).map(({b,spent})=>{let p=Math.round(spent/Math.max(1,b.limit)*100);return '<div class="progress-item"><div class="progress-meta"><b>'+esc(b.category)+'</b><span>'+money(spent)+' / '+money(b.limit)+'</span></div><div class="track"><span style="width:'+Math.min(100,p)+'%;background:'+(p>=100?'var(--red)':p>=75?'var(--amber)':'var(--bright)')+'"></span></div><div class="stat-foot">'+(p>=100?'Over limit — review new spending':p>=75?'Getting close to your limit':'Within your set limit')+'</div></div>'}).join(''):'<p class="detail-note">Set category limits to receive useful overspending alerts.</p>')+'</section></div><div class="insight"><b>How to use this report</b>Prioritize essentials and upcoming bills, then review high or rising flexible categories such as shopping, dining, entertainment, and subscriptions. This report uses transactions you entered and cannot see unrecorded bank activity.</div>'}

function renderBudgets(){let m=currentTx();return header('Spend with a plan','Budgets','Set your own category limits. Progress comes from recorded expenses.','<button class="btn primary" data-action="new-budget">＋ Add budget</button>')+'<div class="grid budget-grid">'+(db.budgets.map(b=>{let spent=sum(m.filter(t=>t.type==='expense'&&t.category===b.category),'amount'),p=Math.min(100,Math.round(spent/b.limit*100)),left=b.limit-spent;return '<section class="panel feature-card"><div class="stat-top"><span class="entity"><span class="entity-icon">'+icon(b.category)+'</span><b>'+esc(b.category)+'</b></span><button class="icon-btn" data-action="edit-budget" data-id="'+b.id+'" aria-label="Edit budget">✎</button></div><div class="feature-big">'+money(spent)+' <span class="muted-small" style="display:inline">/ '+money(b.limit)+'</span></div><div class="track"><span style="width:'+p+'%;background:'+(p>=100?'var(--red)':p>=80?'var(--amber)':'var(--bright)')+'"></span></div><p>'+(left>=0?money(left)+' left this month':money(-left)+' over your limit')+' · '+p+'% used</p><button class="btn small" data-action="delete-budget" data-id="'+b.id+'">Remove</button></section>'}).join('')||'<div class="panel empty">No budgets yet. Add a category limit to begin.</div>')+'</div><div class="insight" style="margin-top:15px"><b>Budget alerts</b>This demo shows the current progress when you open it. Push alerts for budget thresholds are not enabled yet.</div>'}
function renderGoals(){return header('Save toward what matters','Savings goals','Set a target, record contributions, and track progress.','<button class="btn primary" data-action="new-goal">＋ New goal</button>')+'<div class="grid goal-grid">'+(db.goals.map(g=>{let p=Math.min(100,Math.round(g.saved/g.target*100)),left=Math.max(g.target-g.saved,0);return '<section class="panel feature-card"><div class="stat-top"><span class="entity-icon">◎</span><button class="icon-btn" data-action="edit-goal" data-id="'+g.id+'" aria-label="Edit goal">✎</button></div><h3 style="margin-top:12px">'+esc(g.name)+'</h3><div class="feature-big">'+money(g.saved)+' <span class="muted-small" style="display:inline">of '+money(g.target)+'</span></div><div class="track"><span style="width:'+p+'%"></span></div><p>'+p+'% complete · '+money(left)+' to go'+(g.deadline?' · target '+dateFmt(g.deadline):'')+'</p><button class="btn green small" data-action="contribute" data-id="'+g.id+'">＋ Add contribution</button> <button class="btn danger small" data-action="delete-goal" data-id="'+g.id+'">Remove goal</button></section>'}).join('')||'<div class="panel empty">Create a savings goal when you have one in mind.</div>')+'</div>'}

function renderHelp(){return header('Help and app information','Help & feedback','Find quick answers, review how this prototype handles data, or leave feedback saved on this device.','')+'<div class="help-layout"><section class="panel feature-card"><div class="eyebrow">Quick answers</div><div class="help-item"><b>How do I add a transaction?</b><p>Use Add transaction in the header or Transactions. Review each entry before saving; transactions update the recorded balance, budgets and reports.</p></div><div class="help-item"><b>Will the app pay bills automatically?</b><p>No. Add bills to track due dates and confirm a payment only after checking your bank or card statement. Autopay reminders ask you to verify the debit.</p></div><div class="help-item"><b>How are spending reports calculated?</b><p>Reports use the income and expense transactions you entered here. Transfers are excluded from spending totals. This prototype does not connect to your bank.</p></div><div class="help-item"><b>Do reminders work when the app is closed?</b><p>In-app reminders run while the site is open. Browser notifications require permission and the site to be running; no background push service is configured.</p></div></section><section class="panel feature-card"><div class="eyebrow">Data and terms</div><div id="help-privacy" class="help-item"><b>Privacy</b><p>Finance entries are stored in this browser on this device. Avoid entering account passwords, card numbers, PINs, or other secrets. Clearing browser data removes saved records unless you export them first.</p></div><div id="help-terms" class="help-item"><b>Use of this prototype</b><p>This tool organizes manually entered records for personal planning. It does not provide regulated financial advice, verify balances, initiate payments, or guarantee reminder delivery. Review amounts and due dates against your provider statements.</p></div><div class="divider"></div><div class="eyebrow">Feedback</div><p>Feedback stays in this browser; this demo btn danger small" data-action="reset-data">Reset demo</button></div><div class="insight" style="margin:14px 0 0"><b>Privacy by design</b>No bank sync, payment execution, account credentials, AI advice, or cloud backup is enabled in this prototype.</div></section>'}
function renderCalendar(){let first=new Date(today.getFullYear(),today.getMonth()+calendarOffset,1),start=new Date(first);start.setDate(1-first.getDay());let cells=Array.from({length:42},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);let key=iso(d),items=db.bills.filter(b=>b.due===key);return '<div class="calendar-day '+(d.getMonth()!==today.getMonth()?'muted ':'')+(key===iso(today)?'today':'')+'"><b>'+d.getDate()+'</b>'+items.map(b=>'<span class="calendar-event" title="'+esc(b.name)+' · '+money(b.amount)+'">'+esc(b.name)+'</span>').join('')+'</div>'});return header('Plan ahead','Financial calendar','Your tracked bill dates, including recurring next due dates.','<button class="btn primary" data-action="new-bill">＋ Add bill</button>')+'<section class="panel feature-card"><div class="panel-head"><button class="btn small" data-action="calendar-prev">← Previous</button><div class="panel-title">'+first.toLocaleDateString('en-IN',{month:'long',year:'numeric'})+'</div><button class="btn small" data-action="calendar-next">Next →</button></div><div class="calendar-head">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="calendar-grid">'+cells.join('')+'</div></section><div class="insight" style="margin-top:14px"><b>Calendar source</b>Dates are based only on commitments you entered. Reminders appear in-app while this browser is open; browser notifications require permission.</div>'}

function showGoalForm(g){let html='<form id="goal-form" class="form-grid">'+inputField('Goal name','name','text',g?.name,'Emergency fund',true)+inputField('Target amount (₹)','target','number',g?.target,'50000',true).replace('type="number"','type="number" min="0.01" step="0.01"')+inputField('Already saved (₹)','saved','number',g?.saved||0,'0',true)+inputField('Target date','deadline','date',g?.deadline||offset(180),'')+'<div class="field full">'+modalActions('Save goal')+'</div></form>';openModal(g?'Edit goal':'Create savings goal','You control the target and the contribution record.',html);document.getElementById('goal-form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());v.target=Number(v.target);v.saved=Number(v.saved);if(g){v.id=g.id;db.goals=db.goals.map(x=>x.id===g.id?v:x)}else{v.id=uid();db.goals.push(v)}save();closeModal();toast('Goal saved.')}}
function showContribution(g){let html='<form id="contrib-form" class="form-grid">'+inputField('Contribution amount (₹)','amount','number','','500',true).replace('type="number"','type="number" min="0.01" step="0.01"')+'<div class="field full">'+modalActions('Record contribution')+'</div></form>';openModal('Add to '+g.name,'This updates your goal tracker. It does not move money.',html);document.getElementById('contrib-form').onsubmit=e=>{e.preventDefault();let v=Number(new FormData(e.target).get('amount'));if(v>0){g.saved+=v;save();closeModal();toast('Contribution recorded.')}}}
function showAccountForm(a){let types=['Bank','Wallet','Cash','Other'];let html='<form id="account-form" class="form-grid">'+inputField('Account nickname','name','text',a?.name,'Main bank',true)+selectField('Type','type',types,a?.type||'Bank')+inputField('Opening balance (₹)','opening','number',a?.opening,'0',true)+'<div class="field full">'+modalActions('Save account')+'</div></form>';openModal(a?'Edit account':'Add account','Use a nickname only. Never add a bank account number or password.',html);document.getElementById('account-form').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target).entries());v.opening=Number(v.opening);v.color='green';if(a){v.id=a.id;db.accounts=db.accounts.map(x=>x.id===a.id?v:x)}else{v.id=uid();db.accounts.push(v)}save();closeModal();toast('Account saved.')}}
function exportCsv(){let rows=[['date','type','amount_INR','category','description','account_nickname','to_account_nickname','payment_method','source'],...db.transactions.map(t=>[t.date,t.type,t.amount,t.category,t.merchant,acctName(t.account),t.type==='transfer'?acctName(t.toAccount):'',t.method,t.source])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='smart-finance-transactions.csv';a.click();URL.revokeObjectURL(a.href);toast('CSV downloaded.')}
async function enableNotifications(){if(!('Notification'in window)){toast('This browser does not support notifications.');return}let p=await Notification.requestPermission();toast(p==='granted'?'Browser reminders enabled.':'Notifications are off. In-app reminders remain available.')}document.getElementById('notify-btn').onclick=enableNotifications;
function periodicBriefing(period,key,title,body){if(!db.notificationPrefs?.[period]||!('Notification'in window)||Notification.permission!=='granted'||localStorage.getItem('sf-brief-'+period+'-'+key)==='sent')return;localStorage.setItem('sf-brief-'+period+'-'+key,'sent');new Notification(title,{body,icon:'/icon.svg'})}
function checkPeriodicBriefings(){let now=new Date();if(now.getHours()<9)return;let todayKey=iso(now),due=db.bills.filter(b=>b.status!=='paid'&&b.due<=todayKey),todaySpend=sum(db.transactions.filter(t=>t.type==='expense'&&t.date===todayKey),'amount');periodicBriefing('daily',todayKey,'Your daily money check-in',due.length?due.length+' unpaid bill'+(due.length===1?'':'s')+' due or overdue. Today’s recorded spending: '+money(todaySpend)+'.':'No bills due or overdue today. Recorded spending: '+money(todaySpend)+'.');if(now.getDay()===1){let week=db.transactions.filter(t=>t.type==='expense'&&Math.floor((now-new Date(t.date+'T00:00:00'))/86400000)>=0&&Math.floor((now-new Date(t.date+'T00:00:00'))/86400000)<7),amount=sum(week,'amount'),upcoming=db.bills.filter(b=>b.status!=='paid'&&b.due>=todayKey&&b.due<=addDays(todayKey,7)).length;periodicBriefing('weekly',todayKey,'Your weekly money review',money(amount)+' recorded spending over the last 7 days. '+upcoming+' unpaid bill'+(upcoming===1?'':'s')+' due in the next 7 days.')};if(now.getDate()===1){let prev=new Date(now.getFullYear(),now.getMonth()-1,1),monthKey=iso(prev).slice(0,7),items=db.transactions.filter(t=>t.date.slice(0,7)===monthKey),spend=sum(items.filter(t=>t.type==='expense'),'amount'),income=sum(items.filter(t=>t.type==='income'),'amount');periodicBriefing('monthly',monthKey,'Your monthly money review',money(spend)+' recorded expenses and '+money(income)+' income last month. Open Analytics to review categories and budgets.')}}
function billReminderDue(b,d){let cadence=b.reminderCadence||'smart',priority=b.priority||(/rent|loan|emi|credit|insurance|electricity|water/i.test(b.category+' '+b.name)?'Essential':'Important');if(d<0){let late=Math.abs(d);if(cadence==='daily'||priority==='Essential')return true;if(cadence==='weekly'||priority==='Flexible')return (late-1)%7===0;return (late-1)%3===0}if(cadence==='daily')return d<=7;if(cadence==='weekly')return d<=28&&d%7===0;let days=priority==='Essential'?[7,3,1,0]:priority==='Flexible'?[1,0]:[3,1,0];return days.includes(d)||d===Number(b.reminderDays??3)}
function checkBillReminders(){let key=iso(today);for(let b of db.bills){if(b.status==='paid'||(b.snoozedUntil&&b.snoozedUntil>key))continue;let d=Math.ceil((new Date(b.due+'T00:00:00')-today)/86400000);if(billReminderDue(b,d)&&localStorage.getItem('sf-reminder-'+b.id+'-'+key)!=='sent'){localStorage.setItem('sf-reminder-'+b.id+'-'+key,'sent');let urgency=d<0?' is overdue by '+Math.abs(d)+' day'+(d===-1?'':'s'):d===0?' is due today.':' is due in '+d+' days.';let msg=b.name+urgency+(b.autopay?' Check that autopay actually cleared.':'');toast(msg);if('Notification'in window&&Notification.permission==='granted')new Notification('Smart Finance payment reminder',{body:msg,icon:'/icon.svg'})}}}checkBillReminders();setInterval(checkBillReminders,60000);checkPeriodicBriefings();setInterval(checkPeriodicBriefings,60000);
document.addEventListener('change',e=>{if(e.target.id==='receipt-file'){let file=e.target.files[0];if(file){let reader=new FileReader();reader.onload=()=>{document.getElementById('receipt-preview').innerHTML='<img alt="Selected receipt preview" src="'+reader.result+'"><p>Receipt selected. Enter the details manually and verify them before saving; OCR is not enabled.</p>'};reader.readAsDataURL(file)}}});
if(localStorage.getItem('sf-sidebar-collapsed')==='1')document.body.classList.add('sidebar-collapsed');if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});render();
</script></body></html>
